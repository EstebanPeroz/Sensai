# Cases of the model benchmark. Every pattern is a case-insensitive regular expression: an answer passes when one of
# its `expected` patterns matches.

# Latency: the same question, alone, then after a long context, to see what reading the context costs.
[latency]
question = "Explain in about 100 words what a hash table is."
filler = """A distributed system is a group of computers working together so that they appear to the user as a \
single machine. Each node keeps part of the state, and the nodes exchange messages over the network to agree on it. \
Networks lose, delay and reorder messages, and nodes crash and restart, so the protocols must tolerate partial \
failures. Replication keeps copies of the data on several nodes, which helps availability but raises the question \
of consistency: whether every reader sees the latest write. """
# Repetitions of the filler making the long context, about 4,000 tokens.
filler_repeat = 45
runs = 3

# Answers: questions with a single verifiable answer, asked through the ReAct loop without tools.
[[quality]]
id = "capital"
prompt = "What is the capital of Australia?"
expected = ["canberra"]

[[quality]]
id = "multiplication"
prompt = "What is 17 multiplied by 23?"
expected = ["\\b391\\b"]

[[quality]]
id = "apples"
prompt = "J'ai 3 pommes, j'en mange une, puis j'en achète 5. Combien de pommes ai-je maintenant ?"
expected = ["\\b7\\b", "\\bsept\\b"]

[[quality]]
id = "author"
prompt = "Qui a écrit Les Misérables ?"
expected = ["hugo"]

[[quality]]
id = "gold"
prompt = "What is the chemical symbol of gold?"
expected = ["\\bAu\\b"]

[[quality]]
id = "leap-year"
prompt = "Combien de jours compte une année bissextile ?"
expected = ["\\b366\\b"]

[[quality]]
id = "boiling"
prompt = "At what temperature, in degrees Fahrenheit, does water boil at sea level?"
expected = ["\\b212\\b"]

[[quality]]
id = "youngest"
prompt = "Alice is older than Bob, and Bob is older than Carol. Who is the youngest?"
expected = ["carol"]

[[quality]]
id = "sequence"
prompt = "What is the next number of the sequence 2, 6, 12, 20, 30?"
expected = ["\\b42\\b"]

[[quality]]
id = "train"
prompt = "Un train part à 14h10 et arrive à 16h45. Combien de temps dure le trajet ?"
expected = ["2\\s*h\\s*(?:et\\s*)?35", "\\b155\\s*min", "2 heures et 35"]

[[quality]]
id = "planet"
prompt = "Which is the largest planet of the solar system?"
expected = ["jupiter"]

[[quality]]
id = "fraction"
prompt = "Write 0.75 as a fraction in lowest terms."
