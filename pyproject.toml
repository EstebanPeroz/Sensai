[project]
name = "sensai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amos Almacin", email = "jhong.almacin@epitech.eu" },
    { name = "Dimitri Collineau", email = "dimitri.collineau@epitech.eu" },
    { name = "Esteban Peroz", email = "esteban.peroz@epitech.eu" },
    { name = "Ewan Czarny", email = "ewan.czarny@epitech.eu" },
    { name = "Noah Savoye", email = "noah.savoye@epitech.eu" },

]
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio",
    "ruff==0.16.8",
]

[tool.uv.workspace]
members = [
    "packages/protocol",
    "packages/server",
    "packages/client/*",
]

[tool.uv.sources]
sensai-protocol = { workspace = true }
sensai-server   = { workspace = true }
sensai-tui      = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
exclude = [
    ".git",
    ".github",
    ".venv"
]
line-length = 120

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    "D203",
    "D213",
    "COM812",
    "CPY001",
    "D100",
    "D104",
    "T201",
]

[tool.ruff.lint.per-file-ignores]
"tests/server/rag/test_server_rag_chunking.py" = ["SLF001"]
"tests/**" = [
    "S101",
    "INP001",
    "PLR2004",
    "D",
    "TC",
]
