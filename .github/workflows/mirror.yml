name: Mirror

env:
  TARGET_REPO_URL: "git@github.com:EpitechPGE3-2026/G-AIA-500-NAN-5-1-sensai-2.git"

on:
  workflow_run:
    workflows: [ "Checks" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  push_to_mirror:
    name: Push to Target Main Repository
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.TARGET_REPO_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
