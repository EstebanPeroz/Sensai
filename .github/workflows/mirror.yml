name: Mirror

env:
  TARGET_REPO_NAME: "EpitechPGE3-2026/G-AIA-500-NAN-5-1-sensai-2"

on:
  workflow_run:
    workflows: [ "Checks" ]
    types: [ completed ]
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  push_to_mirror:
    name: Push to Target Main Repository
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            git@github.com:${{ env.TARGET_REPO_NAME }}.git
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
