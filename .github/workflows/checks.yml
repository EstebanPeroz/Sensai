name: Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/epitech/coding-style-checker:latest

    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@v7
    - name: Install
      run: uv sync --locked
    - name: Program runs
      run: uv run sensai
    - name: Coding style
      run: uv run pre-commit run --all-files --show-diff-on-failure
    - name: Tests
      run: uv run pytest
